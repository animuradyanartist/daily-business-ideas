name = "daily-business-ideas-bot"
main = "src/index.mjs"
compatibility_date = "2026-04-01"

[[kv_namespaces]]
binding = "BOT_KV"
id = "d1edb794ea3442a790d4e9e69127a5ca"

[vars]
GITHUB_REPO = "animuradyanartist/daily-business-ideas"
ALLOWED_CHAT_ID = "1010175368"
# Secrets (set with `wrangler secret put <NAME>`, never committed):
#   BOT_TOKEN      — Telegram bot token
#   WEBHOOK_SECRET — shared secret in the webhook URL ?secret=
#   GITHUB_TOKEN   — fine-grained PAT with Contents:read+write on this repo,
#                    used by "📊 Log outcome" to write outcomes/<date>.md
