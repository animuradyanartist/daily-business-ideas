name: Daily research agent

on:
  schedule:
    # Primary: 09:00 Asia/Yerevan = 05:00 UTC
    - cron: '0 5 * * *'
    # Backup: 10:00 Asia/Yerevan = 06:00 UTC — runs only if today's memo is still missing
    - cron: '0 6 * * *'
  workflow_dispatch: # manual run button

jobs:
  research:
    runs-on: ubuntu-latest
    # 6-stage Gemini pipeline; bound the run so a hung call can't burn minutes.
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run daily research
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/daily-research.mjs

      - name: Commit and push
        id: commit
        run: |
          set -e
          DATE=$(date -u +%Y-%m-%d)
          git config user.name "Daily Ideas Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            echo "committed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Pull the title from today's memo for the commit message
          TITLE=$(head -1 "ideas/${DATE}.md" | sed 's/^#[[:space:]]*//' | tr -d '\r')
          if [ -z "${TITLE}" ]; then
            TITLE="daily idea"
          fi

          # Pull conviction + score
          CONVICTION=$(grep -oE 'conviction:\s*(high|medium|low)' "ideas/${DATE}.md" | head -1 | sed 's/.*:\s*//' || echo "medium")
          SCORE=$(grep -oE 'score:\s*[0-9]{1,3}/100' "ideas/${DATE}.md" | head -1 | sed 's/.*:\s*//' || echo "")

          git commit -m "idea(${DATE}): ${TITLE}"

          # Push resiliently: another scheduled workflow may have pushed to main
          # between checkout and now. Rebase onto latest and retry.
          for i in 1 2 3 4 5; do
            if git push; then
              break
            fi
            echo "push rejected, rebasing onto latest main (attempt ${i})…"
            git pull --rebase origin main
            if [ "${i}" -eq 5 ]; then
              echo "push failed after retries"; exit 1
            fi
          done

          echo "committed=true" >> $GITHUB_OUTPUT
          echo "title=${TITLE}" >> $GITHUB_OUTPUT
          echo "conviction=${CONVICTION}" >> $GITHUB_OUTPUT
          echo "score=${SCORE}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT

      - name: Notify Telegram
        if: steps.commit.outputs.committed == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          DATE="${{ steps.commit.outputs.date }}"
          TITLE="${{ steps.commit.outputs.title }}"
          CONVICTION="${{ steps.commit.outputs.conviction }}"
          SCORE="${{ steps.commit.outputs.score }}"
          MEMO_URL="https://github.com/${GITHUB_REPOSITORY}/blob/main/ideas/${DATE}.md"

          if [ -n "${SCORE}" ]; then
            HEAD_LINE="${DATE} — ${CONVICTION} conviction (${SCORE})"
          else
            HEAD_LINE="${DATE} — ${CONVICTION} conviction"
          fi

          MSG="💡 ${HEAD_LINE}
          ${TITLE}

          Memo: ${MEMO_URL}"

          # Fail loudly on a missing secret: without this, curl posts to an invalid
          # URL, gets a 404, and still exits 0 — a green step that sent nothing.
          if [ -z "${TG_BOT_TOKEN}" ]; then
            echo "::error::TG_BOT_TOKEN is not set — refusing to send." >&2
            exit 1
          fi

          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=${MSG}"
