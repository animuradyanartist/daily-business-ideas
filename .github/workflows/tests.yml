name: Tests

# Unit, offline-pipeline and spend-ledger tests on the Actions runtime (Node 20).
# No secrets are used; nothing is committed, deployed or sent.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Runtime versions
        run: node --version && git --version

      - name: Scout tests (unit + offline pipeline + spend ledger)
        run: node --test --test-reporter=spec scripts/test/*.test.mjs

      - name: Bot tests
        working-directory: bot
        run: node --test test/parse.test.mjs
